version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "08:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      patch-minor:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      security-patch-minor:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    assignees:
      - "JuniorThanhBQ"
    labels:
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "Maintenance"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7

  - package-ecosystem: "composer"
    directory: "/laravel"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "08:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      patch-minor:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      security-patch-minor:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    assignees:
      - "JuniorThanhBQ"
    labels:
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "Maintenance"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/laravel"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "08:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      patch-minor:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      security-patch-minor:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    assignees:
      - "JuniorThanhBQ"
    labels:
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "Maintenance"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "08:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      patch-minor:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    assignees:
      - "JuniorThanhBQ"
    labels:
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "Maintenance"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
