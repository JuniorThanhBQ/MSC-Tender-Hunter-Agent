[project]
name = "tenderhunter-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Van Trung Thanh", email = "thanh.vantrung2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "curl-cffi>=0.17.0",
    "fastapi[standard]>=0.162.0",
    "fastmcp>=4.1.6",
    "pydantic-ai>=2.65.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tenderhunter-agent = "tenderhunter_agent:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
